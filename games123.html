<!DOCTYPE html>
<html>
<head>
<style>
body { margin:0; background:#87CEEB; font-family:Arial; text-align:center; }
#game { width:100%; max-width:400px; height:300px; background:#87CEEB; position:relative; overflow:hidden; margin:auto; border:3px solid black; }
#ground { position:absolute; bottom:0; width:100%; height:50px; background:#8B4513; }
#player { position:absolute; bottom:50px; left:50px; width:35px; height:45px; background:#00C853; border:2px solid black; }
#hair { position:absolute; top:-8px; left:0; width:35px; height:12px; background:#1565C0; }
#eye { position:absolute; top:15px; right:5px; width:6px; height:6px; background:black; }
#enemy { position:absolute; bottom:50px; right:-40px; width:30px; height:30px; background:#FF5722; border-radius:50%; }
button { padding:15px 25px; font-size:20px; margin:5px; border-radius:10px; }
#score { font-size:22px; font-weight:bold; }
</style>
</head>
<body>
<h2>🟢 SWARDIGO RUNNER 🔵</h2>
<p id="score">Score: 0 | HP: 3</p>
<div id="game">
  <div id="ground"></div>
  <div id="player"><div id="hair"></div><div id="eye"></div></div>
  <div id="enemy"></div>
</div>
<br>
<button onclick="jump()">⬆️ TALON</button>
<button onclick="startGame()">▶️ START</button>

<script>
let player = document.getElementById("player");
let enemy = document.getElementById("enemy");
let scoreText = document.getElementById("score");
let y = 50, vy = 0, jumping = false;
let enemyX = 400, score = 0, hp = 3, playing = false;

function jump(){
  if(!jumping){ vy = 14; jumping = true; }
}
document.addEventListener("keydown", function(e){
  if(e.key === " " || e.key === "ArrowUp") jump();
});

function startGame(){
  score = 0; hp = 3; enemyX = 400; playing = true;
  scoreText.innerText = "Score: 0 | HP: 3";
  gameLoop();
}

function gameLoop(){
  if(!playing) return;
  // Gravity
  y += vy; vy -= 0.8;
  if(y <= 50){ y = 50; vy = 0; jumping = false; }
  player.style.bottom = y + "px";

  // Enemy galaw
  enemyX -= 5;
  if(enemyX < -40){ enemyX = 400; score++; }
  enemy.style.right = (400 - enemyX) + "px";

  // Bangga?
  if(enemyX > 40 && enemyX < 90 && y < 90){
    hp--; enemyX = 400;
    scoreText.innerText = "Score: " + score + " | HP: " + hp;
    if(hp <= 0){ alert("GAME OVER! Score mo: " + score); playing = false; return; }
  }
  scoreText.innerText = "Score: " + score + " | HP: " + hp;
  requestAnimationFrame(gameLoop);
}
</script>
</body>
</html>
